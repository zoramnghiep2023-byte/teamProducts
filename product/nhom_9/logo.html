<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="logo.css">
</head>

<body>
    <div class="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoI68s2dqmJfqQ-m6mcd6DHqdWmqYD4g7doKD_H_84cvAik0Qz6lBXyMFs&s=10" alt="Logo Prada">
        <span>Prada <span class="blue">Fashion</span></span>
    </div>
    <div class="header-right">
        <p class="Welcome">Welcome to the Prada Store</p>
        <div class="acount">
            <a href="#account" onclick="showAccount()">My Account</a>
            <a href="#">Favorites</a>
            <a href="#">My Cart</a>
            <a href="#">Checkout</a>
            <a href="#login">Log In</a>
            <a href="#register">Register</a>
        </div>
        <div class="search-cart">
            <div class="search">
                <input type="text" placeholder="Search">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="cart">
                <i class="fas fa-shopping-cart"></i> My Cart: <span>0.00 $</span>
            </div>
        </div>
    </div>
    <div class="forms">
        <div id="register">
            <h2>Register</h2>
            <input type="text" id="name" placeholder="Your name"><br><br>
            <input type="email" id="regEmail" placeholder="Email"><br><br>
            <input type="password" id="regPass" placeholder="Password"><br><br>
            <button onclick="register()">Register</button>
        </div>
        <hr>
        <div id="login">
            <h2>Log In</h2>
            <input type="email" id="loginEmail" placeholder="Email"><br><br>
            <input type="password" id="loginPass" placeholder="Password"><br><br>
            <button onclick="login()">Log In</button>
        </div>
        <div id="account"></div>
    </div>
    <script src="logo.js"></script>
</body>

</html>
